<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Delivery Areas</title>

<script>
const token = localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "login.html";
}
</script>

    <link rel="stylesheet" href="../css/delivery.css">
</head>

<body>

<h2>🚚 Delivery Areas / Zones</h2>

<!-- ✅ FORM -->
<div class="form">

  <input type="text" id="areaName" placeholder="Area / Village Name (Dhoptala)">
  
  <input type="text" id="pincode" placeholder="Pincode">
  
  <input type="number" id="charge" placeholder="Delivery Charge ₹">
  
  <input type="number" id="time" placeholder="Delivery Time (Minutes)">

  <input type="number" id="freeDeliveryAbove" placeholder="Free Delivery Above ₹ (e.g. 400)">

  <input type="number" id="minimumOrder" placeholder="Minimum Order ₹ (e.g. 100)">

  <button onclick="addArea()">➕ Add Area</button>

</div>

<hr>

<!-- ✅ LIST -->
<h3>📍 All Areas</h3>

<table width="100%" id="areaTable">
  <thead>
 <tr>
  <th>Area</th>
  <th>Pincode</th>
  <th>Charge ₹</th>
  <th>Time</th>
  <th>Free Above ₹</th>
  <th>Min Order ₹</th>
  <th>Action</th>
</tr>
  </thead>

  <tbody id="areaList"></tbody>
</table>

<script src="../js/delivery.js"></script>

</body>
</html>
