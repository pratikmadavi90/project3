<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>



    <link rel="stylesheet" href="../css/add-product.css">
</head>

<body>

<div class="container">

    <div class="form-section">

        <h2>Add Product</h2>

        <input
            type="text"
            id="name"
            placeholder="Product Name"
        >

<select id="category">
    <option value="">Select Category</option>
</select>

<input
  type="text"
  id="subCategory"
  placeholder="Enter Sub Category"
/>

        <input
            type="number"
            id="mrp"
            placeholder="MRP"
        >

        <input
            type="number"
            id="price"
            placeholder="Selling Price"
        >

        <input
            type="number"
            id="stock"
            placeholder="Stock"
        >

 <input
    type="number"
    id="maxOrderQuantity"
    placeholder="Max Order Quantity"
/>       

        <input
            type="text"
            id="weight"
            placeholder="Weight (500g, 1kg, 2L etc)"
        >

        <textarea
            id="description"
            placeholder="Description"
        ></textarea>

<input
    type="file"
    id="images"
    multiple
    accept="image/*"
>

<div style="display:flex;justify-content:flex-end;margin-top:10px;">
    <input
        type="number"
        id="displayOrder"
        placeholder="Order"
        style="width:100px;"
    >
</div>

<button onclick="addProduct()">
    Add Product
</button>

    </div>

</div>

<script>

const BASE_URL =
    "https://api.harzo.in";

const categorySelect =
    document.getElementById("category");


 const subCategory =
  document.getElementById("subCategory");   

 const params =
  new URLSearchParams(window.location.search);

const categoryId = params.get("categoryId");
const categoryName = params.get("categoryName");
const productId = params.get("id");


if (productId) {
    document.querySelector("button").innerText = "Update Product";
}
// document.getElementById("category").value = categoryId; 


 async function loadCategories() {

    try {

        const res = await fetch(
            `${BASE_URL}/api/product-categories`
        );

        const data = await res.json();

        categorySelect.innerHTML =
            '<option value="">Select Category</option>';

        data.categories.forEach(cat => {

            categorySelect.innerHTML += `
                <option value="${cat._id}">
                    ${cat.name}
                </option>
            `;

        });

        if (categoryId) {
            categorySelect.value = categoryId;
            loadSubCategories();
        }

    } catch (error) {

        console.error(error);

    }

}    

async function loadSubCategories() {

    try {

        if (!categoryId) return;

        const res = await fetch(
            `https://api.harzo.in/api/sub-categories/category/${categoryId}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const data = await res.json();

    } catch (error) {

        console.error(error);

    }

}


async function loadProductForEdit() {

    if (!productId) return;

    try {

        const res = await fetch(
            `${BASE_URL}/api/all-products/${productId}`
        );

        const data = await res.json();

        const product = data.product;

        document.getElementById("name").value =
            product.name || "";

        document.getElementById("mrp").value =
            product.mrp || "";

        document.getElementById("price").value =
            product.sellingPrice || "";

        document.getElementById("stock").value =
            product.stock || "";

        document.getElementById("maxOrderQuantity").value =
           product.maxOrderQuantity || "";    

        document.getElementById("weight").value =
            product.weight || "";

        document.getElementById("description").value =
            product.description || "";

        if(product.categoryId){
            categorySelect.value = product.categoryId;
        }

        subCategory.value =
            product.subCategory || "";

        document.getElementById("displayOrder").value =
            product.displayOrder || 1;            

    } catch(error) {

        console.log(error);

    }
}


// Add Product
async function addProduct() {

    try {

        const name =
            document.getElementById("name").value.trim();

        const mrp =
            document.getElementById("mrp").value;

        const sellingPrice =
            document.getElementById("price").value;

        const stock =
            document.getElementById("stock").value;

        const maxOrderQuantity =
            document.getElementById("maxOrderQuantity").value;

        const weight =
            document.getElementById("weight").value;

        const description =
            document.getElementById("description").value;
  
        const displayOrder =
             document.getElementById("displayOrder").value || 999;

        const files =
            document.getElementById("images").files;

        if (!name) {
            return alert("Enter Product Name");
        }

if (!categoryId && !categorySelect.value) {
    return alert("Select Category");
}

        if (!mrp) {
            return alert("Enter MRP");
        }

        if (!sellingPrice) {
            return alert("Enter Selling Price");
        }


        const formData =
            new FormData();

formData.append(
    "categoryId",
    categoryId || categorySelect.value
);

formData.append(
  "subCategory",
  subCategory.value
);        

formData.append(
    "categoryName",
    localStorage.getItem("selectedCategoryName") || categoryName
);

        formData.append(
            "name",
            name
        );

        formData.append(
            "mrp",
            mrp
        );

        formData.append(
            "sellingPrice",
            sellingPrice
        );

        formData.append(
            "stock",
            stock
        );

 formData.append(
    "maxOrderQuantity",
    maxOrderQuantity
);       

        formData.append(
            "weight",
            weight
        );

        formData.append(
            "description",
            description
        );

formData.append(
    "displayOrder",
    displayOrder
);        

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            formData.append(
                "images",
                files[i]
            );

        }

let url = `${BASE_URL}/api/all-products/add`;
let method = "POST";

if (productId) {
    url = `${BASE_URL}/api/all-products/${productId}`;
    method = "PUT";
}

const res = await fetch(url, {
    method,
    body: formData
});

        const result =
            await res.json();

        if (!res.ok) {

            alert(
                result.message ||
                "Failed To Add Product"
            );

            return;
        }

        alert(
            "Product Added Successfully"
        );

        document.getElementById("name").value = "";
        document.getElementById("mrp").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("maxOrderQuantity").value = "";
        document.getElementById("weight").value = "";
        document.getElementById("description").value = "";
        document.getElementById("displayOrder").value = "";
        document.getElementById("images").value = "";

        categorySelect.selectedIndex = 0;

    } catch (error) {

        console.error(error);

        alert(
            "Something Went Wrong"
        );

    }

}




loadCategories().then(() => {
    loadProductForEdit();
});

</script>

</body>
</html>
