<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <script>
        const token = localStorage.getItem("adminToken");

        if (!token) {
            window.location.href = "login.html";
        }
    </script>

    <link rel="stylesheet" href="../css/add-product.css">
</head>

<body>

<div class="container">

    <div class="form-section">

        <h2>Add Product</h2>

        <input
            type="text"
            id="name"
            placeholder="Product Name"
        >

<input
  type="hidden"
  id="category"
/>

<input
  type="text"
  id="subCategory"
  placeholder="Enter Sub Category"
/>

        <input
            type="number"
            id="mrp"
            placeholder="MRP"
        >

        <input
            type="number"
            id="price"
            placeholder="Selling Price"
        >

        <input
            type="number"
            id="stock"
            placeholder="Stock"
        >

        <input
            type="text"
            id="weight"
            placeholder="Weight (500g, 1kg, 2L etc)"
        >

        <textarea
            id="description"
            placeholder="Description"
        ></textarea>

        <input
            type="file"
            id="images"
            multiple
            accept="image/*"
        >

        <button onclick="addProduct()">
            Add Product
        </button>

    </div>

</div>

<script>

const BASE_URL =
    "https://api.harzo.in";

const categorySelect =
    document.getElementById("category");


 const subCategory =
  document.getElementById("subCategory");   

 const params =
  new URLSearchParams(window.location.search);

const categoryId = params.get("categoryId");
const categoryName = params.get("categoryName");

// document.getElementById("category").value = categoryId; 

// Load Categories
async function loadCategories() {

    try {

        const res = await fetch(
            `${BASE_URL}/api/product-categories`
        );

        const data = await res.json();

        categorySelect.innerHTML =
            '<option value="">Select Category</option>';

        data.categories.forEach(cat => {

            categorySelect.innerHTML += `
                <option
                    value="${cat._id}"
                    data-name="${cat.name}"
                >
                    ${cat.name}
                </option>
            `;

        });

 if (categoryId) {
    categorySelect.value = categoryId;
    loadSubCategories();
}      

async function loadSubCategories() {

  if (!categoryId) return;

  const res = await fetch(
    `https://api.harzo.in/api/sub-categories/category/${categoryId}`,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  subCategory.innerHTML =
    `<option value="">Select Sub Category</option>`;

  data.subCategories.forEach(sub => {

    subCategory.innerHTML += `
      <option value="${sub.name}">
        ${sub.name}
      </option>
    `;

  });

}   

    } catch (error) {

        console.error(error);

        categorySelect.innerHTML =
            '<option value="">Failed To Load</option>';

    }

}


// Add Product
async function addProduct() {

    try {

        const name =
            document.getElementById("name").value.trim();

        const mrp =
            document.getElementById("mrp").value;

        const sellingPrice =
            document.getElementById("price").value;

        const stock =
            document.getElementById("stock").value;

        const weight =
            document.getElementById("weight").value;

        const description =
            document.getElementById("description").value;

        const files =
            document.getElementById("images").files;

        if (!name) {
            return alert("Enter Product Name");
        }

if (!categoryId && !categorySelect.value) {
    return alert("Select Category");
}

        if (!mrp) {
            return alert("Enter MRP");
        }

        if (!sellingPrice) {
            return alert("Enter Selling Price");
        }

        const selectedCategory =
            categorySelect.options[
                categorySelect.selectedIndex
            ];

        const formData =
            new FormData();

formData.append(
    "categoryId",
    categoryId || categorySelect.value
);

formData.append(
  "subCategory",
  subCategory.value
);        

        formData.append(
            "categoryName",
            selectedCategory.dataset.name
        );

        formData.append(
            "name",
            name
        );

        formData.append(
            "mrp",
            mrp
        );

        formData.append(
            "sellingPrice",
            sellingPrice
        );

        formData.append(
            "stock",
            stock
        );

        formData.append(
            "weight",
            weight
        );

        formData.append(
            "description",
            description
        );

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            formData.append(
                "images",
                files[i]
            );

        }

        const res =
            await fetch(
                `${BASE_URL}/api/all-products/add`,
                {
                    method: "POST",
                    body: formData
                }
            );

        const result =
            await res.json();

        if (!res.ok) {

            alert(
                result.message ||
                "Failed To Add Product"
            );

            return;
        }

        alert(
            "Product Added Successfully"
        );

        document.getElementById("name").value = "";
        document.getElementById("mrp").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("weight").value = "";
        document.getElementById("description").value = "";
        document.getElementById("images").value = "";

        categorySelect.selectedIndex = 0;

    } catch (error) {

        console.error(error);

        alert(
            "Something Went Wrong"
        );

    }

}

  document.getElementById("subCategory").style.display = "block";
}

loadCategories();

</script>

</body>
</html>
