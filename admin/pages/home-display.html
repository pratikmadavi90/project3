<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Display Management</title>

  <link rel="stylesheet" href="../css/home-display.css">
</head>

<body>

  <div class="container">

    <h1>Home Display Management</h1>

    <!-- FEATURED CATEGORY -->

    <div class="section">

      <div class="section-header">
        <h2>Featured Categories</h2>

        <button
          type="button"
          id="addFeaturedBtn"
          class="add-btn"
        >
          + Add Category
        </button>
      </div>

      <div id="featuredContainer"></div>

    </div>

    <!-- PERSONAL CARE -->

    <div class="section">

      <div class="section-header">
        <h2>Personal Care</h2>

        <button
          type="button"
          id="addPersonalBtn"
          class="add-btn"
        >
          + Add Item
        </button>
      </div>

      <div id="personalCareContainer"></div>

    </div>

    <!-- HOUSEHOLD -->

    <div class="section">

      <div class="section-header">
        <h2>Household</h2>

        <button
          type="button"
          id="addHouseholdBtn"
          class="add-btn"
        >
          + Add Item
        </button>
      </div>

      <div id="householdContainer"></div>

    </div>

    <!-- SAVE -->

    <div class="save-area">

      <button
        type="button"
        id="saveBtn"
        class="save-btn"
      >
        Save Home Display
      </button>

    </div>

  </div>

  <!-- TEMPLATES -->

  <template id="featuredTemplate">

    <div class="card featured-card">

      <div class="card-header">

        <h3>Featured Category</h3>

        <button
          type="button"
          class="delete-btn"
        >
          Delete
        </button>

      </div>

      <input
        type="text"
        class="title-input"
        placeholder="Category Title"
      >

      <input
        type="text"
        class="category-input"
        placeholder="Open Category (Example: Grocery)"
      >

      <label>Image 1</label>
      <input type="file" class="image1">

      <label>Image 2</label>
      <input type="file" class="image2">

      <label>Image 3</label>
      <input type="file" class="image3">

      <label>Image 4</label>
      <input type="file" class="image4">

    </div>

  </template>

  <template id="itemTemplate">

    <div class="card item-card">

      <div class="card-header">

        <h3>Item</h3>

        <button
          type="button"
          class="delete-btn"
        >
          Delete
        </button>

      </div>

      <input
        type="text"
        class="name-input"
        placeholder="Item Name"
      >

      <input
        type="text"
        class="category-input"
        placeholder="Category"
      >

      <input
        type="text"
        class="subcategory-input"
        placeholder="Sub Category"
      >

      <input
        type="file"
        class="image-input"
      >

    </div>

  </template>

  <script src="../js/home-display.js"></script>

</body>

</html>
