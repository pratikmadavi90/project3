<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Display Management</title>

<link rel="stylesheet" href="../css/home-display.css">
</head>
<body>

<div class="container">

<h1>Home Display Management</h1>

<!-- PERSONAL CARE -->
<div class="section">
  <h2>PERSONAL CARE</h2>
  <div id="personalCareContainer" class="grid"></div>
</div>

<!-- SNACKS -->
<div class="section">
  <h2>SNACKS</h2>
  <div id="snacksContainer" class="grid"></div>
</div>

<!-- GROCERY -->
<div class="section">
  <h2>GROCERY</h2>
  <div id="groceryContainer" class="grid"></div>
</div>

<!-- BEVERAGES -->
<div class="section">
  <h2>BEVERAGES</h2>
  <div id="beveragesContainer" class="grid"></div>
</div>

<!-- DAIRY -->
<div class="section">
  <h2>DAIRY</h2>
  <div id="dairyContainer" class="grid"></div>
</div>

<!-- HOUSEHOLD -->
<div class="section">
  <h2>HOUSEHOLD</h2>
  <div id="householdContainer" class="grid"></div>
</div>

<button id="saveBtn" class="save-btn">
  Save All Changes
</button>

</div>

<!-- CARD TEMPLATE -->
<template id="itemTemplate">
  <div class="card">

    <img
      class="preview"
      src="https://via.placeholder.com/120"
      alt=""
    >

    <input
      type="file"
      class="image-input"
      accept="image/*"
    >

<input
  type="text"
  class="name-input"
  placeholder="Category Name"
>

<div style="display:flex;gap:8px;margin-top:8px;">

  <button
    class="single-save-btn"
    type="button"
  >
    Save
  </button>

  <button
    class="clear-btn"
    type="button"
  >
    Clear
  </button>

</div>
</template>

<script src="../js/home-display.js"></script>

</body>
</html>
