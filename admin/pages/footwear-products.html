<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Footwear Products</title>


  <link
    rel="stylesheet"
    href="../css/footwear-products.css"
  />
</head>
<body>

  <div class="container">

    <h1>Footwear Products</h1>

    <!-- Product Form -->

    <div class="product-form">

      <input
        type="text"
        id="name"
        placeholder="Chappal Name"
      />

      <input
        type="text"
        id="brand"
        placeholder="Brand"
      />

<div class="sizes-section">

  <h3>Size Wise Stock</h3>

  <div class="sizes-grid">

    <div class="size-item">
      <label>5</label>
      <input type="number" id="size5" placeholder="0">
    </div>

    <div class="size-item">
      <label>6</label>
      <input type="number" id="size6" placeholder="0">
    </div>

    <div class="size-item">
      <label>7</label>
      <input type="number" id="size7" placeholder="0">
    </div>

    <div class="size-item">
      <label>8</label>
      <input type="number" id="size8" placeholder="0">
    </div>

    <div class="size-item">
      <label>9</label>
      <input type="number" id="size9" placeholder="0">
    </div>

    <div class="size-item">
      <label>10</label>
      <input type="number" id="size10" placeholder="0">
    </div>

    <div class="size-item">
      <label>11</label>
      <input type="number" id="size11" placeholder="0">
    </div>

    <div class="size-item">
      <label>12</label>
      <input type="number" id="size12" placeholder="0">
    </div>

  </div>

</div>

      <input
        type="number"
        id="mrp"
        placeholder="MRP"
      />

      <input
        type="number"
        id="sellingPrice"
        placeholder="Selling Price"
      />


 <input
  type="number"
  id="displayOrder"
  placeholder="Display Order"
/>     

      <textarea
        id="description"
        placeholder="Description"
      ></textarea>

<select id="category">
  <option value="">
    Select Category
  </option>
</select>

      <input
        type="file"
        id="images"
        multiple
      />

      <button id="saveBtn">
        Add Product
      </button>

    </div>

    <!-- Product List -->

    <div id="productsGrid">

    </div>

  </div>

  <script src="../js/footwear-products.js"></script>

</body>
</html>
