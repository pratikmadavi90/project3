<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Footwear Products</title>


  <link
    rel="stylesheet"
    href="../css/footwear-products.css"
  />
</head>
<body>

  <div class="container">

    <h1>Footwear Products</h1>

    <!-- Product Form -->

    <div class="product-form">

      <input
        type="text"
        id="name"
        placeholder="Chappal Name"
      />

      <input
        type="text"
        id="brand"
        placeholder="Brand"
      />

      <input
        type="text"
        id="size"
        placeholder="Size (8,9,10)"
      />

      <input
        type="number"
        id="mrp"
        placeholder="MRP"
      />

      <input
        type="number"
        id="sellingPrice"
        placeholder="Selling Price"
      />

      <input
        type="number"
        id="stock"
        placeholder="Stock"
      />

 <input
  type="number"
  id="displayOrder"
  placeholder="Display Order"
/>     

      <textarea
        id="description"
        placeholder="Description"
      ></textarea>

<select id="category">
  <option value="">
    Select Category
  </option>
</select>

      <input
        type="file"
        id="images"
        multiple
      />

      <button id="saveBtn">
        Add Product
      </button>

    </div>

    <!-- Product List -->

    <div id="productsGrid">

    </div>

  </div>

  <script src="../js/footwear-products.js"></script>

</body>
</html>
