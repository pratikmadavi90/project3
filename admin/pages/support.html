<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Support Tickets</title>
<script>
const token = localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "login.html";
}
</script>

<link rel="stylesheet"
href="../css/support.css">

</head>

<body>

<div class="container">

<div class="header">

<h2>
Support Tickets
</h2>

<button
onclick="loadTickets()"
class="refreshBtn"
>
Refresh
</button>

</div>

<div class="support-settings-card">

<h3>Support Contact Numbers</h3>

<input
type="text"
id="callNumber1"
placeholder="Call Number 1"
/>

<input
type="text"
id="callNumber2"
placeholder="Call Number 2"
/>

<button
onclick="saveSupportNumbers()"
class="saveBtn"
>
Save Numbers
</button>

</div>

<div id="ticketList">

<p class="loading">
Loading tickets...
</p>

</div>

</div>



<script src="../js/support.js"></script>

</body>
</html>
